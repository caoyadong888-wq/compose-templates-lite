name: ct-nginx-https

# backend owns the network namespace and the published ports.
# nginx joins that namespace and proxies to 127.0.0.1:8081.
services:
  backend:
    image: nginx:1.30.6-alpine
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./backend/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  nginx:
    image: nginx:1.30.6-alpine
    network_mode: "service:backend"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
      - webroot:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.8.0
    profiles: ["letsencrypt"]
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-example.com}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-admin@example.com}
    volumes:
      - ./scripts/renew-loop.sh:/scripts/renew-loop.sh:ro
      - webroot:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt
      - ./certs:/certs
    entrypoint: ["/bin/sh", "/scripts/renew-loop.sh"]
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  webroot:
